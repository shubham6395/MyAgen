[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myagent"
version = "0.1.0"
description = "Multi-agent codebase documentation generator: 16-doc suite with approver review and incremental updates."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
myagent = "myagent.cli:main"
myagent-mcp = "myagent.mcp_server:main"

[tool.setuptools.packages.find]
include = ["myagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["fixtures", "docs", ".myagent", "node_modules", ".git", ".venv"]